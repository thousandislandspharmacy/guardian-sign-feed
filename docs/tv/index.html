<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Christmas Giveaway</title>
<style>
html,body{margin:0;height:100%;background:#00643C;overflow:hidden;cursor:none}
video{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#00643C}
#hint{position:fixed;left:0;right:0;bottom:6%;text-align:center;font:700 28px Arial,sans-serif;color:#fff;display:none}
</style></head><body>
<video id="v" src="giveaway.mp4?v=3" autoplay loop muted playsinline preload="auto"></video>
<div id="hint">Press OK / Select on the remote to start</div>
<script>
var v=document.getElementById('v'),hint=document.getElementById('hint');
function go(){var p=v.play();if(p&&p.catch)p.catch(function(){hint.style.display='block';});}
function full(){hint.style.display='none';go();var f=v.requestFullscreen||v.webkitRequestFullscreen;if(f&&!document.fullscreenElement){try{f.call(v);}catch(e){}}}
document.addEventListener('click',full);document.addEventListener('keydown',full);
v.addEventListener('ended',function(){v.currentTime=0;go();});
v.addEventListener('stalled',function(){setTimeout(go,2000);});
go();
// Self-heal: if the video errors or stops advancing for 20 s, reload it (then the whole page).
var lastT=-1,stuck=0,heals=0;
function heal(){heals++;if(heals>3){location.replace('./?r='+Date.now());return;}v.src='giveaway.mp4?v='+VER+'&r='+Date.now();v.load();go();}
v.addEventListener('error',function(){setTimeout(heal,3000);});
setInterval(function(){if(hint.style.display==='block')return;if(v.currentTime===lastT){stuck++;if(stuck>=2){stuck=0;heal();}}else{stuck=0;heals=0;lastT=v.currentTime;}},10000);
// Pick up a new video by itself: check version.txt every 10 minutes and reload when it changes.
var VER='3';
setInterval(function(){var x=new XMLHttpRequest();x.open('GET','version.txt?t='+Date.now());x.timeout=20000;
  x.onload=function(){var t=(x.responseText||'').replace(/\s/g,'');if(x.status===200&&/^\d+$/.test(t)&&t!==VER){location.replace('./?v='+t);}};
  x.send();},600000);
</script></body></html>
